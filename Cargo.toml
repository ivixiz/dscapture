[package]
name = "dscapture"
version = "0.1.0"
edition = "2024"
description = "Heuristic electronic component datasheet parser with OCR fallback"
license = "MIT"

[lib]
name = "dscapture"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dscapture"
path = "src/main.rs"

[features]
default = []
opencv-preprocessing = ["dep:opencv"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.39"
opencv = { version = "0.99", optional = true, default-features = false, features = ["imgcodecs", "imgproc"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.26"
thiserror = "2.0"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
